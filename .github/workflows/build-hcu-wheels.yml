---

name: Build HCU Wheels

on:
  push:
    branches:
      - ci-release
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "deep_ep/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepep-hcu-wheels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_INDEX_URL: http://10.16.1.201:9929/nightly/dtk2604/+simple/
  PIP_TRUSTED_HOST: 10.16.1.201
  CISMI_TIMEOUT: "3600"
  CI: "false"
  FREE_BUILD_DIR: "0"

jobs:
  authorize:
    name: Authorize build source
    runs-on:
      group: ci-general
      labels: [self-hosted, ci, bw1100]
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.authorize.outputs.should_run }}
      controller_ref: ${{ steps.authorize.outputs.controller_ref }}
      source_ref: ${{ steps.authorize.outputs.source_ref }}
      base_sha: ${{ steps.authorize.outputs.base_sha }}
      head_sha: ${{ steps.authorize.outputs.head_sha }}
      build_mode: ${{ steps.authorize.outputs.build_mode }}
    steps:
      - name: Authorize source ref
        id: authorize
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request_target" ]]; then
            {
              echo "should_run=true"
              echo "controller_ref=${WORKFLOW_SHA}"
              echo "source_ref=${WORKFLOW_SHA}"
              echo "base_sha="
              echo "head_sha="
              echo "build_mode=build"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${HEAD_REPOSITORY}" != "${BASE_REPOSITORY}" ]]; then
            echo "Fork PR execution is disabled until an isolated approval path is configured." >&2
            exit 1
          fi

          should_run=true
          if [[ "${PR_DRAFT}" == "true" ]]; then
            should_run=false
          fi
          {
            echo "should_run=${should_run}"
            echo "controller_ref=${BASE_SHA}"
            echo "source_ref=refs/pull/${PR_NUMBER}/merge"
            echo "base_sha=${BASE_SHA}"
            echo "head_sha=${HEAD_SHA}"
            echo "build_mode=pr-build"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.build_variant }} / torch-${{ matrix.torch_version }}
    needs: authorize
    if: needs.authorize.outputs.should_run == 'true'
    runs-on:
      group: ci-general
      labels: [self-hosted, ci, bw1100]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        build_variant:
          - standard
          - shca
        torch_version:
          - "2.10.0"
          - "2.11.0"
        include:
          - build_variant: standard
            image: ${{ vars.DEEPEP_CI_STANDARD_IMAGE }}
            dtk_package: ${{ vars.DEEPEP_CI_STANDARD_DTK_PACKAGE }}
          - build_variant: shca
            image: ${{ vars.DEEPEP_CI_SHCA_IMAGE }}
            dtk_package: ${{ vars.DEEPEP_CI_SHCA_DTK_PACKAGE }}
    env:
      IMAGE: ${{ matrix.image }}
      BUILD_VARIANT: ${{ matrix.build_variant }}
      TORCH_VERSION: ${{ matrix.torch_version }}
      DEEPEP_SOURCE_REF: ${{ needs.authorize.outputs.source_ref }}
      DEEPEP_PR_BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
      DEEPEP_PR_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
      BUILD_MODE: ${{ needs.authorize.outputs.build_mode }}
      DTK_PACKAGE: ${{ matrix.dtk_package }}
      CI_PUBLIC_ROOT: ${{ vars.DEEPEP_CI_PUBLIC_ROOT }}
      CI_PUBLIC_OUTPUT_DIR: >-
        ${{ vars.DEEPEP_CI_PUBLIC_ROOT }}/${{ github.run_id }}/attempt-${{ github.run_attempt
        }}/build-${{ matrix.build_variant }}-torch-${{ matrix.torch_version }}
    steps:
      - name: Normalize workspace ownership before checkout
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(realpath -m -- "${GITHUB_WORKSPACE}")"
          runner_temp="$(realpath -m -- "${RUNNER_TEMP}")"
          work_root="$(dirname -- "${runner_temp}")"
          case "${workspace}" in "${work_root}"/*/*) ;; *) exit 1 ;; esac
          runner_owner="$(stat -c '%u:%g' -- "${RUNNER_TEMP}")"
          [[ "${runner_owner}" =~ ^[1-9][0-9]*:[0-9]+$ ]]
          runner_container=""
          if [[ -f /.dockerenv ]]; then
            current_hostname="$(hostname)"
            if docker inspect --type container "${current_hostname}" >/dev/null 2>&1; then
              runner_container="${current_hostname}"
            else
              while IFS= read -r container_id; do
                container_hostname="$(docker inspect --format '{{.Config.Hostname}}' "${container_id}")"
                if [[ "${container_hostname}" == "${current_hostname}" ]]; then
                  runner_container="${container_id}"
                  break
                fi
              done < <(docker ps --quiet)
            fi
          fi
          if [[ -n "${runner_container}" ]]; then
            docker exec --user 0 "${runner_container}" \
              /bin/chown -R -- "${runner_owner}" "${workspace}"
          else
            docker run --rm --user 0:0 \
              --volume "${workspace}:/workspace" \
              --entrypoint /bin/chown \
              "${IMAGE}" -R -- "${runner_owner}" /workspace
          fi

      - name: Checkout trusted controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.controller_ref }}
          path: controller
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Checkout selected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.source_ref }}
          path: source
          fetch-depth: 2
          submodules: false
          persist-credentials: false

      - name: Prepare CI public root
        shell: bash
        run: >-
          bash controller/.github/scripts/hcu/ci.sh
          prepare-ci-public-root "${CI_PUBLIC_ROOT}"

      - name: Build and verify wheel in container
        shell: bash
        env:
          HYGON_AI_CI_TOKEN: ${{ secrets.HYGON_AI_CI_TOKEN }}
        run: |
          bash controller/.github/scripts/hcu/ci.sh \
            run-ci-container controller source "${IMAGE}" \
            "${BUILD_VARIANT}" "${TORCH_VERSION}" "${DTK_PACKAGE}" "${BUILD_MODE}" \
            source/final source/ci-logs

      - name: Restore workspace ownership
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f controller/.github/scripts/hcu/ci.sh ]]; then
            bash controller/.github/scripts/hcu/ci.sh \
              restore-workspace-with-container "${GITHUB_WORKSPACE}" "${IMAGE}"
          else
            workspace="$(realpath -m -- "${GITHUB_WORKSPACE}")"
            runner_owner="$(stat -c '%u:%g' -- "${RUNNER_TEMP}")"
            [[ "${runner_owner}" =~ ^[1-9][0-9]*:[0-9]+$ ]]
            docker run --rm --user 0:0 \
              --volume "${workspace}:/workspace" \
              --entrypoint /bin/chown \
              "${IMAGE}" -R -- "${runner_owner}" /workspace
          fi

      - name: Save wheel and build log to CI public directory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f controller/.github/scripts/hcu/ci.sh ]]; then
            bash controller/.github/scripts/hcu/ci.sh \
              save-ci-output source "${CI_PUBLIC_OUTPUT_DIR}"
          else
            echo "CI controller was not checked out; no output is available to save."
          fi

---

name: Build HCU Wheels

on:
  push:
    branches:
      - ci-release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepep-hcu-wheels-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_INDEX_URL: http://10.16.1.201:9929/nightly/dtk2604/+simple/
  PIP_TRUSTED_HOST: 10.16.1.201
  CISMI_TIMEOUT: "3600"
  CI: "false"
  FREE_BUILD_DIR: "0"

jobs:
  build:
    name: ${{ matrix.build_variant }} / torch-${{ matrix.torch_version }}
    runs-on:
      group: ci-general
      labels: [self-hosted, ci, bw1100]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        build_variant:
          - standard
          - shca
        torch_version:
          - "2.10.0"
          - "2.11.0"
        include:
          - build_variant: standard
            image: harbor.sourcefind.cn:5443/dcu/admin/base/dev:rockylinux8.6-mpi5.0-gcc10.3-cmake3.29-py3.10-mkl2020.4.304
            dtk_package: http://10.16.1.201:8000/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
          - build_variant: shca
            image: 10.16.1.152:5000/jenkins/base_env/shca17:ubuntu22.04-dtk2604-py3.10-dtk2604
            dtk_package: http://10.16.1.201:8000/dtk-pkg/dtk26.04/DTK-26.04-rc4-ubuntu20.04-x86_64.tar.gz
    container:
      image: ${{ matrix.image }}
      volumes:
        - /public/opendas/ArchivedFile:/ArchivedFile:ro
        - /opt/hyhal:/opt/hyhal:ro
        - /ci_public/deepep-das/runs:/ci_public/deepep-das/runs
      options: >-
        --device=/dev/kfd
        --device=/dev/dri
        --group-add=video
        --shm-size=16g
        --cap-add=SYS_PTRACE
        --privileged
    env:
      BUILD_VARIANT: ${{ matrix.build_variant }}
      TORCH_VERSION: ${{ matrix.torch_version }}
      DTK_PACKAGE: ${{ matrix.dtk_package }}
      CI_PUBLIC_ROOT: /ci_public/deepep-das/runs
      CI_PUBLIC_OUTPUT_DIR: /ci_public/deepep-das/runs/${{ github.run_id }}/attempt-${{ github.run_attempt }}/build-${{ matrix.build_variant }}-torch-${{ matrix.torch_version }}
    steps:
      - name: Normalize workspace ownership before checkout
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(realpath -m -- "${GITHUB_WORKSPACE}")"
          runner_temp="$(realpath -m -- "${RUNNER_TEMP}")"
          work_root="$(dirname -- "${runner_temp}")"
          case "${workspace}" in "${work_root}"/*/*) ;; *) exit 1 ;; esac
          container_owner="$(id -u):$(id -g)"
          [[ "${container_owner}" =~ ^[0-9]+:[0-9]+$ ]]
          chown -R -- "${container_owner}" "${workspace}"

      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          path: source
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Prepare CI public root
        shell: bash
        run: >-
          bash source/.github/scripts/hcu/ci.sh
          prepare-ci-public-root "${CI_PUBLIC_ROOT}"

      - name: Checkout pinned rocSHMEM submodule
        shell: bash
        env:
          HYGON_AI_CI_TOKEN: ${{ secrets.HYGON_AI_CI_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p source/ci-logs
          git config --global --add safe.directory "$(realpath -- source)"
          git config --global --add safe.directory "$(realpath -m -- source/third-party/rocshmem)"
          bash source/.github/scripts/hcu/ci.sh checkout-rocshmem source \
            2>&1 | tee source/ci-logs/submodule.log

      - name: Build and verify wheel
        shell: bash
        run: |
          set -o pipefail
          mkdir -p source/ci-logs
          bash source/.github/scripts/hcu/ci.sh \
            build-wheel source "${BUILD_VARIANT}" "${TORCH_VERSION}" "${DTK_PACKAGE}" source/final \
            2>&1 | tee source/ci-logs/build.log

      - name: Save wheel and build log to CI public directory
        if: always()
        shell: bash
        run: >-
          bash source/.github/scripts/hcu/ci.sh
          save-ci-output source "${CI_PUBLIC_OUTPUT_DIR}"

      - name: Restore workspace ownership
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f source/.github/scripts/hcu/ci.sh ]]; then
            bash source/.github/scripts/hcu/ci.sh restore-workspace "${GITHUB_WORKSPACE}"
          else
            owner="$(stat -c '%u:%g' -- "${RUNNER_TEMP}")"
            [[ "${owner}" =~ ^[1-9][0-9]*:[0-9]+$ ]]
            chown -R -- "${owner}" "${GITHUB_WORKSPACE}"
          fi

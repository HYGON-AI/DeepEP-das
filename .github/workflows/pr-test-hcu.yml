---

name: PR Test HCU

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to test
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: deepep-pr-hcu-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  PIP_INDEX_URL: http://10.16.1.201:9929/nightly/dtk2604/+simple/
  PIP_TRUSTED_HOST: 10.16.1.201
  CISMI_TIMEOUT: "3600"
  CI: "false"
  FREE_BUILD_DIR: "0"

jobs:
  authorize:
    name: Authorize PR source
    runs-on:
      group: ci-general
      labels: [self-hosted, ci, bw1100]
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.authorize.outputs.should_run }}
      controller_ref: ${{ steps.authorize.outputs.controller_ref }}
      source_ref: ${{ steps.authorize.outputs.source_ref }}
      base_sha: ${{ steps.authorize.outputs.base_sha }}
      head_sha: ${{ steps.authorize.outputs.head_sha }}
    steps:
      - name: Authorize source ref
        id: authorize
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          MANUAL_REF: ${{ inputs.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            {
              echo "should_run=true"
              echo "controller_ref=${WORKFLOW_SHA}"
              echo "source_ref=${MANUAL_REF}"
              echo "base_sha="
              echo "head_sha="
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${HEAD_REPOSITORY}" != "${BASE_REPOSITORY}" ]]; then
            echo "Fork PR execution is disabled until an isolated approval path is configured." >&2
            exit 1
          fi

          should_run=true
          if [[ "${PR_DRAFT}" == "true" ]]; then
            should_run=false
          fi
          {
            echo "should_run=${should_run}"
            echo "controller_ref=${BASE_SHA}"
            echo "source_ref=refs/pull/${PR_NUMBER}/merge"
            echo "base_sha=${BASE_SHA}"
            echo "head_sha=${HEAD_SHA}"
          } >> "${GITHUB_OUTPUT}"

  test:
    name: standard / torch-2.10.0
    needs: authorize
    if: needs.authorize.outputs.should_run == 'true'
    runs-on:
      group: ci-general
      labels: [self-hosted, ci, bw1100]
    timeout-minutes: 180
    env:
      CI_IMAGE: harbor.sourcefind.cn:5443/dcu/admin/base/dev:rockylinux8.6-mpi5.0-gcc10.3-cmake3.29-py3.10-mkl2020.4.304
      BUILD_VARIANT: standard
      TORCH_VERSION: "2.10.0"
      DTK_PACKAGE: http://10.16.1.201:8000/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
      CI_PUBLIC_ROOT: /ci_public/deepep-das/runs
      CI_PUBLIC_OUTPUT_DIR: /ci_public/deepep-das/runs/${{ github.run_id }}/attempt-${{ github.run_attempt }}/pr-standard-torch-2.10.0
    steps:
      - name: Normalize workspace ownership before checkout
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(realpath -m -- "${GITHUB_WORKSPACE}")"
          runner_temp="$(realpath -m -- "${RUNNER_TEMP}")"
          work_root="$(dirname -- "${runner_temp}")"
          case "${workspace}" in "${work_root}"/*/*) ;; *) exit 1 ;; esac
          owner="$(stat -c '%u:%g' -- "${runner_temp}")"
          [[ "${owner}" =~ ^[1-9][0-9]*:[0-9]+$ ]]
          docker run --rm \
            --volume "${workspace}:${workspace}" \
            --entrypoint chown \
            "${CI_IMAGE}" \
            -R -- "${owner}" "${workspace}"

      - name: Checkout trusted controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.controller_ref }}
          path: controller
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Checkout selected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.authorize.outputs.source_ref }}
          path: source
          fetch-depth: 2
          submodules: false
          persist-credentials: false

      - name: Prepare CI public root
        shell: bash
        run: |
          set -euo pipefail
          umask 0002
          mkdir -p -- "${CI_PUBLIC_ROOT}"
          [[ -d "${CI_PUBLIC_ROOT}" && -w "${CI_PUBLIC_ROOT}" ]]

      - name: Validate PR merge ref
        if: github.event_name == 'pull_request_target'
        shell: bash
        run: >-
          bash controller/.github/scripts/hcu/ci.sh validate-pr-merge source
          "${{ needs.authorize.outputs.base_sha }}"
          "${{ needs.authorize.outputs.head_sha }}"

      - name: Checkout pinned rocSHMEM submodule
        shell: bash
        env:
          HYGON_AI_CI_TOKEN: ${{ secrets.HYGON_AI_CI_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p source/ci-logs
          bash controller/.github/scripts/hcu/ci.sh checkout-rocshmem source \
            2>&1 | tee source/ci-logs/submodule.log

      - name: Build, verify, and run PR tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p source/ci-logs
          docker run --rm \
            --device=/dev/kfd \
            --device=/dev/dri \
            --group-add=video \
            --shm-size=16g \
            --cap-add=SYS_PTRACE \
            --volume "${GITHUB_WORKSPACE}/source:${GITHUB_WORKSPACE}/source" \
            --volume "${GITHUB_WORKSPACE}/controller:${GITHUB_WORKSPACE}/controller:ro" \
            --volume /opt/hyhal:/opt/hyhal:ro \
            --workdir "${GITHUB_WORKSPACE}/source" \
            --env PIP_INDEX_URL \
            --env PIP_TRUSTED_HOST \
            --env CISMI_TIMEOUT \
            --env CI \
            --env FREE_BUILD_DIR \
            --env BUILD_VARIANT \
            --env TORCH_VERSION \
            --env DTK_PACKAGE \
            --env SOURCE_DIR="${GITHUB_WORKSPACE}/source" \
            --env CONTROLLER_SCRIPT="${GITHUB_WORKSPACE}/controller/.github/scripts/hcu/ci.sh" \
            --entrypoint bash \
            "${CI_IMAGE}" \
            -c '
              set -euo pipefail
              git config --global --add safe.directory "${SOURCE_DIR}"
              bash "${CONTROLLER_SCRIPT}" build-wheel \
                "${SOURCE_DIR}" "${BUILD_VARIANT}" "${TORCH_VERSION}" \
                "${DTK_PACKAGE}" "${SOURCE_DIR}/final"
              bash "${CONTROLLER_SCRIPT}" run-pr-tests \
                "${SOURCE_DIR}" "${SOURCE_DIR}/final" "${SOURCE_DIR}/ci-logs"
            ' 2>&1 | tee source/ci-logs/build.log

      - name: Save wheel and test logs to CI public directory
        if: always()
        shell: bash
        run: >-
          bash controller/.github/scripts/hcu/ci.sh
          save-ci-output source "${CI_PUBLIC_OUTPUT_DIR}"

      - name: Restore workspace ownership
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f controller/.github/scripts/hcu/ci.sh ]]; then
            workspace="$(realpath -m -- "${GITHUB_WORKSPACE}")"
            runner_temp="$(realpath -m -- "${RUNNER_TEMP}")"
            work_root="$(dirname -- "${runner_temp}")"
            case "${workspace}" in "${work_root}"/*/*) ;; *) exit 1 ;; esac
            owner="$(stat -c '%u:%g' -- "${runner_temp}")"
            [[ "${owner}" =~ ^[1-9][0-9]*:[0-9]+$ ]]
            docker run --rm \
              --volume "${workspace}:${workspace}" \
              --entrypoint chown \
              "${CI_IMAGE}" \
              -R -- "${owner}" "${workspace}"
          else
            echo "Controller checkout is unavailable; workspace ownership was not changed by this job."
          fi

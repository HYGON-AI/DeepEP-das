---

name: Nightly Test HCU

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to test
        required: true
        default: main
        type: string
      torch_version:
        description: PyTorch version
        required: true
        default: "2.10.0"
        type: choice
        options:
          - "2.10.0"
          - "2.11.0"
      build_variant:
        description: Communication backend build variant
        required: true
        default: standard
        type: choice
        options:
          - standard
          - shca
      test_profile:
        description: Cross-node test profile
        required: true
        default: all
        type: choice
        options:
          - internode
          - low-latency
          - all

permissions:
  contents: read

concurrency:
  group: deepep-nightly-hcu-${{ inputs.ref }}-${{ inputs.build_variant }}
  cancel-in-progress: false

env:
  PIP_INDEX_URL: http://10.16.1.201:9929/nightly/dtk2604/+simple/
  PIP_TRUSTED_HOST: 10.16.1.201
  CISMI_TIMEOUT: "3600"
  CI: "false"
  FREE_BUILD_DIR: "0"

jobs:
  test:
    name: ${{ inputs.build_variant }} / ${{ inputs.test_profile }}
    if: vars.DEEPEP_HCU_NIGHTLY_ENABLED == 'true'
    runs-on: self-hosted
    timeout-minutes: 360
    container:
      image: ${{ inputs.build_variant == 'shca' && '10.16.1.152:5000/jenkins/base_env/shca17:ubuntu22.04-dtk2604-py3.10-dtk2604' || 'harbor.sourcefind.cn:5443/dcu/admin/base/dev:rockylinux8.6-mpi5.0-gcc10.3-cmake3.29-py3.10-mkl2020.4.304' }}
      volumes:
        - /public/opendas/ArchivedFile:/ArchivedFile:ro
        - /opt/hyhal:/opt/hyhal:ro
        - /ci_public/deepep-das/nightly:/ci/nightly:ro
      options: >-
        --device=/dev/kfd
        --device=/dev/dri
        --group-add=video
        --shm-size=16g
        --cap-add=SYS_PTRACE
    env:
      BUILD_VARIANT: ${{ inputs.build_variant }}
      TORCH_VERSION: ${{ inputs.torch_version }}
      DTK_PACKAGE: ${{ inputs.build_variant == 'shca' && '/ArchivedFile/dtk-pkg/dtk26.04/DTK-26.04-rc4-ubuntu20.04-x86_64.tar.gz' || 'http://10.16.1.201:8000/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz' }}
      DEEPEP_TEST_PROFILE: ${{ inputs.test_profile }}
      DEEPEP_NIGHTLY_CONFIG_ROOT: /ci/nightly
    steps:
      - name: Normalize workspace ownership before checkout
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(realpath -m -- "${GITHUB_WORKSPACE}")"
          runner_temp="$(realpath -m -- "${RUNNER_TEMP}")"
          work_root="$(dirname -- "${runner_temp}")"
          case "${workspace}" in "${work_root}"/*/*) ;; *) exit 1 ;; esac
          owner="$(stat -c '%u:%g' -- "${runner_temp}")"
          [[ "${owner}" =~ ^[1-9][0-9]*:[0-9]+$ ]]
          chown -R -- "${owner}" "${workspace}"

      - name: Checkout trusted controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main
          path: controller
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Checkout selected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          path: source
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Checkout pinned rocSHMEM submodule
        shell: bash
        env:
          HYGON_AI_CI_TOKEN: ${{ secrets.HYGON_AI_CI_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p source/ci-logs
          bash controller/.github/scripts/hcu/ci.sh checkout-rocshmem source \
            2>&1 | tee source/ci-logs/submodule.log

      - name: Build and verify wheel
        shell: bash
        run: |
          set -o pipefail
          mkdir -p source/ci-logs
          bash controller/.github/scripts/hcu/ci.sh \
            build-wheel source "${BUILD_VARIANT}" "${TORCH_VERSION}" "${DTK_PACKAGE}" source/final \
            2>&1 | tee source/ci-logs/build.log

      - name: Run Nightly test hook
        shell: bash
        run: >-
          bash controller/.github/scripts/hcu/ci.sh
          run-nightly-tests source source/final source/ci-logs

      - name: Upload wheel and Nightly logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: deepep-nightly-${{ inputs.build_variant }}-${{ inputs.test_profile }}-${{ github.run_id }}
          path: |
            source/final/*.whl
            source/ci-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Restore workspace ownership
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f controller/.github/scripts/hcu/ci.sh ]]; then
            bash controller/.github/scripts/hcu/ci.sh restore-workspace "${GITHUB_WORKSPACE}"
          else
            owner="$(stat -c '%u:%g' -- "${RUNNER_TEMP}")"
            [[ "${owner}" =~ ^[1-9][0-9]*:[0-9]+$ ]]
            chown -R -- "${owner}" "${GITHUB_WORKSPACE}"
          fi

---

name: Nightly Test HCU

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to test
        required: true
        default: main
        type: string
      torch_version:
        description: PyTorch version
        required: true
        default: "2.10.0"
        type: choice
        options:
          - "2.10.0"
          - "2.11.0"
      build_variant:
        description: Communication backend build variant
        required: true
        default: standard
        type: choice
        options:
          - standard
          - shca
      test_profile:
        description: Cross-node test profile
        required: true
        default: all
        type: choice
        options:
          - internode
          - low-latency
          - all

permissions:
  contents: read

concurrency:
  group: deepep-nightly-hcu-${{ inputs.ref }}-${{ inputs.build_variant }}
  cancel-in-progress: false

env:
  PIP_INDEX_URL: http://10.16.1.201:9929/nightly/dtk2604/+simple/
  PIP_TRUSTED_HOST: 10.16.1.201
  CISMI_TIMEOUT: "3600"
  CI: "false"
  FREE_BUILD_DIR: "0"

jobs:
  test:
    name: ${{ inputs.build_variant }} / ${{ inputs.test_profile }}
    if: vars.DEEPEP_HCU_NIGHTLY_ENABLED == 'true'
    runs-on:
      group: ci-general
      labels: [self-hosted, ci, bw1100]
    timeout-minutes: 360
    env:
      CI_IMAGE: ${{ inputs.build_variant == 'shca' && '10.16.1.152:5000/jenkins/base_env/shca17:ubuntu22.04-dtk2604-py3.10-dtk2604' || 'harbor.sourcefind.cn:5443/dcu/admin/base/dev:rockylinux8.6-mpi5.0-gcc10.3-cmake3.29-py3.10-mkl2020.4.304' }}
      BUILD_VARIANT: ${{ inputs.build_variant }}
      TORCH_VERSION: ${{ inputs.torch_version }}
      DTK_PACKAGE: ${{ inputs.build_variant == 'shca' && '/ArchivedFile/dtk-pkg/dtk26.04/DTK-26.04-rc4-ubuntu20.04-x86_64.tar.gz' || 'http://10.16.1.201:8000/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz' }}
      DEEPEP_TEST_PROFILE: ${{ inputs.test_profile }}
      DEEPEP_NIGHTLY_CONFIG_ROOT: /ci/nightly
      CI_PUBLIC_ROOT: /ci_public/deepep-das/runs
      CI_PUBLIC_OUTPUT_DIR: /ci_public/deepep-das/runs/${{ github.run_id }}/attempt-${{ github.run_attempt }}/nightly-${{ inputs.build_variant }}-${{ inputs.test_profile }}-torch-${{ inputs.torch_version }}
    steps:
      - name: Normalize workspace ownership before checkout
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(realpath -m -- "${GITHUB_WORKSPACE}")"
          runner_temp="$(realpath -m -- "${RUNNER_TEMP}")"
          work_root="$(dirname -- "${runner_temp}")"
          case "${workspace}" in "${work_root}"/*/*) ;; *) exit 1 ;; esac
          owner="$(stat -c '%u:%g' -- "${runner_temp}")"
          [[ "${owner}" =~ ^[1-9][0-9]*:[0-9]+$ ]]
          docker run --rm \
            --volume "${workspace}:${workspace}" \
            --entrypoint chown \
            "${CI_IMAGE}" \
            -R -- "${owner}" "${workspace}"

      - name: Checkout trusted controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: main
          path: controller
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Checkout selected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          path: source
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Prepare CI public root
        shell: bash
        run: |
          set -euo pipefail
          umask 0002
          mkdir -p -- "${CI_PUBLIC_ROOT}"
          [[ -d "${CI_PUBLIC_ROOT}" && -w "${CI_PUBLIC_ROOT}" ]]

      - name: Checkout pinned rocSHMEM submodule
        shell: bash
        env:
          HYGON_AI_CI_TOKEN: ${{ secrets.HYGON_AI_CI_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p source/ci-logs
          bash controller/.github/scripts/hcu/ci.sh checkout-rocshmem source \
            2>&1 | tee source/ci-logs/submodule.log

      - name: Build, verify, and run Nightly tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p source/ci-logs
          docker run --rm \
            --device=/dev/kfd \
            --device=/dev/dri \
            --group-add=video \
            --shm-size=16g \
            --cap-add=SYS_PTRACE \
            --volume "${GITHUB_WORKSPACE}/source:${GITHUB_WORKSPACE}/source" \
            --volume "${GITHUB_WORKSPACE}/controller:${GITHUB_WORKSPACE}/controller:ro" \
            --volume /public/opendas/ArchivedFile:/ArchivedFile:ro \
            --volume /opt/hyhal:/opt/hyhal:ro \
            --volume /ci_public/deepep-das/nightly:/ci/nightly:ro \
            --workdir "${GITHUB_WORKSPACE}/source" \
            --env PIP_INDEX_URL \
            --env PIP_TRUSTED_HOST \
            --env CISMI_TIMEOUT \
            --env CI \
            --env FREE_BUILD_DIR \
            --env BUILD_VARIANT \
            --env TORCH_VERSION \
            --env DTK_PACKAGE \
            --env DEEPEP_TEST_PROFILE \
            --env DEEPEP_NIGHTLY_CONFIG_ROOT \
            --env SOURCE_DIR="${GITHUB_WORKSPACE}/source" \
            --env CONTROLLER_SCRIPT="${GITHUB_WORKSPACE}/controller/.github/scripts/hcu/ci.sh" \
            --entrypoint bash \
            "${CI_IMAGE}" \
            -c '
              set -euo pipefail
              git config --global --add safe.directory "${SOURCE_DIR}"
              bash "${CONTROLLER_SCRIPT}" build-wheel \
                "${SOURCE_DIR}" "${BUILD_VARIANT}" "${TORCH_VERSION}" \
                "${DTK_PACKAGE}" "${SOURCE_DIR}/final"
              bash "${CONTROLLER_SCRIPT}" run-nightly-tests \
                "${SOURCE_DIR}" "${SOURCE_DIR}/final" "${SOURCE_DIR}/ci-logs"
            ' 2>&1 | tee source/ci-logs/build.log

      - name: Save wheel and Nightly logs to CI public directory
        if: always()
        shell: bash
        run: >-
          bash controller/.github/scripts/hcu/ci.sh
          save-ci-output source "${CI_PUBLIC_OUTPUT_DIR}"

      - name: Restore workspace ownership
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f controller/.github/scripts/hcu/ci.sh ]]; then
            workspace="$(realpath -m -- "${GITHUB_WORKSPACE}")"
            runner_temp="$(realpath -m -- "${RUNNER_TEMP}")"
            work_root="$(dirname -- "${runner_temp}")"
            case "${workspace}" in "${work_root}"/*/*) ;; *) exit 1 ;; esac
            owner="$(stat -c '%u:%g' -- "${runner_temp}")"
            [[ "${owner}" =~ ^[1-9][0-9]*:[0-9]+$ ]]
            docker run --rm \
              --volume "${workspace}:${workspace}" \
              --entrypoint chown \
              "${CI_IMAGE}" \
              -R -- "${owner}" "${workspace}"
          else
            echo "Controller checkout is unavailable; workspace ownership was not changed by this job."
          fi
